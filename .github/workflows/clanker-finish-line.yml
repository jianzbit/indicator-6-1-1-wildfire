name: Clanker finish line

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: clanker-finish-line
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  complete-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged indicator
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Complete the lap
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: node .clanker/finish-version.mjs

      - name: Record version in indicator repo
        if: steps.version.outputs.already_recorded != 'true'
        env:
          VERSION: ${{ steps.version.outputs.completed_version }}
        run: |
          git config user.name "clanker-race[bot]"
          git config user.email "clanker-race[bot]@users.noreply.github.com"
          git add .clanker/state.json
          git commit -m "chore: complete Clanker v${VERSION}"
          git tag "clanker-v${VERSION}"
          git push origin main "clanker-v${VERSION}"
