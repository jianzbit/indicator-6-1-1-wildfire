[project]
name = "indicator-6-1-1-wildfire"
version = "0.1.0"
description = "BIT indicator 6.1.1: Buildings in areas impacted by wildfire"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=1.0",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "boto3>=1.34",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire_exposure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/wildfire_exposure"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
