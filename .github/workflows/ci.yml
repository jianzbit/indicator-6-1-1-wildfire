name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests with coverage
        run: uv run pytest --cov=src/wildfire_exposure --cov-report=xml --cov-report=term

      - name: Audit frozen release disposition
        run: uv run python scripts/review_release.py --check
